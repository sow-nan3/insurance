<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探勘保險登記</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #50E3C2;
            --bg-grad: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-grad);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px 40px;
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 700;
            position: relative;
        }
        h2::after {
            content: '';
            width: 100px;
            height: 4px;
            background: var(--primary);
            display: block;
            margin: 10px auto 0;
            border-radius: 2px;
        }
        h4 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 500;
            position: relative;
        }
        .step-group {
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s forwards;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        label {
            display: block;
            margin-bottom: 12px;
            color: #444;
            font-weight: 700;
            font-size: 16px;
        }
        
        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .chip {
            padding: 12px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 30px;
            background: white;
            color: #555;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            outline: none;
            flex-grow: 1;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        @media (min-width: 400px) {
            .chip { flex-grow: 0; }
        }
        .chip:hover {
            border-color: #a4c8e1;
            background: rgba(74, 144, 226, 0.05);
        }
        .chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
            transform: scale(1.02);
        }

        .member-list {
            display: grid;
            gap: 15px;
            margin-top: 15px;
        }
        .member-card {
            background: #fff;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .member-card:hover {
            border-color: #a4c8e1;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.08);
        }
        .member-card.selected {
            border-color: var(--primary);
            background: rgba(74, 144, 226, 0.05);
        }
        .member-card input {
            display: none;
        }
        .custom-checkbox {
            width: 26px;
            height: 26px;
            border: 2px solid #ccc;
            border-radius: 6px;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            flex-shrink: 0;
            background: white;
        }
        .member-card.selected .custom-checkbox {
            background: var(--primary);
            border-color: var(--primary);
        }
        .member-card.selected .custom-checkbox::after {
            content: '✓';
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        .member-info {
            flex-grow: 1;
        }
        .member-name {
            font-size: 17px;
            font-weight: bold;
            color: #333;
        }
        .member-tags {
            margin-top: 8px;
            font-size: 13px;
            color: #777;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            background: #eee;
            font-size: 13px;
            font-weight: 500;
        }
        .tag.fee { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), #357abd);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 25px;
            letter-spacing: 1px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4);
        }
        .btn-submit:active {
            transform: translateY(0);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: scale(0.8) translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        .modal-icon {
            font-size: 70px;
            margin-bottom: 15px;
            animation: bounceIn 1s;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .modal-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .modal-text {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 15px;
        }
        .modal-amount {
            font-size: 38px;
            color: #e74c3c;
            font-weight: 900;
            margin: 15px 0;
        }
        .btn-close {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
        }
        .btn-close:hover {
            background: #357abd;
            transform: scale(1.05);
        }
        
        @media (max-width: 480px) {
            .container { padding: 25px 20px; }
            .chip { font-size: 15px; padding: 10px 16px; }
        }
    </style>
</head>

            {"id": 72, "uid": "M_250", "squad": "大地", "natureName": "石虎", "role": "大蟻", "isAdult": true},
            {"id": 72, "uid": "M_251", "squad": "大地", "natureName": "美國短毛貓", "role": "大蟻", "isAdult": true},
            {"id": 72, "uid": "M_252", "squad": "大地", "natureName": "小象", "role": "小蟻團", "isAdult": false},

            {"id": 73, "uid": "M_254", "squad": "花叢", "natureName": "劍齒虎", "role": "大蟻", "isAdult": true},
            {"id": 73, "uid": "M_255", "squad": "花叢", "natureName": "虎貓", "role": "小蟻團", "isAdult": false},
            {"id": 73, "uid": "M_256", "squad": "花叢", "natureName": "宸睿", "role": "小小蟻", "isAdult": false}
        ];

        const feeRoles = ['小小蟻', '大蟻', '大蜂', '大鹿', '大鷹'];
        
        let selectedSquadValue = '';
        let selectedFamilyIdValue = '';
        let selectedAdultUid = ''; 

        window.onload = () => {
            const squads = [...new Set(rawData.map(item => item.squad).filter(s => s !== '' && s !== 'nan'))];
            const squadList = document.getElementById('squadList');
            
            squads.forEach(squad => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.textContent = squad + '小隊';
                btn.textContent = squad;
                btn.onclick = () => {
                    document.querySelectorAll('#squadList .chip').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    
                    selectedSquadValue = squad;
                    selectedFamilyIdValue = '';
                    selectedAdultUid = '';
                    updateNatureNames();
                };
                squadList.appendChild(btn);
            });
        };

        function updateNatureNames() {
            const natureNameGroup = document.getElementById('natureNameGroup');
            const natureNameList = document.getElementById('natureNameList');
            const familyGroup = document.getElementById('familyGroup');
            
            natureNameList.innerHTML = '';
            familyGroup.style.display = 'none';

            if (!selectedSquadValue) {
                natureNameGroup.style.display = 'none';
                return;
            }

            const adults = rawData.filter(m => m.squad === selectedSquadValue && m.isAdult);
            
            const seen = new Set();
            adults.forEach(adult => {
                const key = adult.id + "_" + adult.natureName;
                if (!seen.has(key)) {
                    seen.add(key);
                    const btn = document.createElement('button');
                    btn.className = 'chip';
                    btn.textContent = `${adult.natureName}`;
                    
                    btn.onclick = () => {
                        document.querySelectorAll('#natureNameList .chip').forEach(c => c.classList.remove('active'));
                        btn.classList.add('active');
                        
                        selectedFamilyIdValue = adult.id;
                        selectedAdultUid = adult.uid; 
                        updateFamilyMembers();
                    };
                    natureNameList.appendChild(btn);
                }
            });
            
            natureNameGroup.style.display = 'block';
            natureNameGroup.classList.remove('animate__fadeInUp');
            void natureNameGroup.offsetWidth;
            natureNameGroup.classList.add('animate__animated', 'animate__fadeInUp');
        }

        function updateFamilyMembers() {
            const familyGroup = document.getElementById('familyGroup');
            const membersContainer = document.getElementById('familyMembers');
            
            membersContainer.innerHTML = '';
            
            if (selectedFamilyIdValue === '') {
                familyGroup.style.display = 'none';
                return;
            }

            const allFamilyMembers = rawData.filter(m => String(m.id) === String(selectedFamilyIdValue));
            
            // 一人多職防呆去重
            const uniqueMembersMap = new Map();
            allFamilyMembers.forEach(m => {
                if (!uniqueMembersMap.has(m.natureName)) {
                    uniqueMembersMap.set(m.natureName, m);
                }
            });
            const familyMembers = Array.from(uniqueMembersMap.values());
            
            familyMembers.forEach((member, index) => {
                const requiresFee = feeRoles.includes(member.role);
                const feeTag = requiresFee ? '<span class="tag fee">需保費 $35</span>' : '';
                const roleTag = (member.role && member.role !== 'nan') ? `<span class="tag">${member.role}</span>` : '';

                const isSelected = (member.uid === selectedAdultUid);
                const cardClass = isSelected ? 'member-card selected animate__animated animate__fadeInUp' : 'member-card animate__animated animate__fadeInUp';
                const checkedAttr = isSelected ? 'checked' : '';

                const card = document.createElement('label');
                card.className = cardClass;
                card.style.animationDelay = `${index * 0.05}s`;
                card.innerHTML = `
                    <div class="custom-checkbox"></div>
                    <input type="checkbox" value="${member.uid}" ${checkedAttr} onchange="toggleCard(this)">
                    <div class="member-info">
                        <div class="member-name">${member.natureName}</div>
                        <div class="member-tags">
                            ${roleTag}
                            ${feeTag}
                        </div>
                    </div>
                `;
                membersContainer.appendChild(card);
            });
            
            familyGroup.style.display = 'block';
        }

        function toggleCard(checkbox) {
            const card = checkbox.closest('.member-card');
            if (checkbox.checked) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        }

        function submitForm() {
            const checkboxes = document.querySelectorAll('#familyMembers input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                alert('請至少選擇一位參與保險的家庭成員！');
                return;
            }

            const selectedUids = Array.from(checkboxes).map(cb => cb.value);
            const rawSelectedMembers = rawData.filter(m => selectedUids.includes(m.uid));
            
            const uniqueSelectedMembersMap = new Map();
            rawSelectedMembers.forEach(m => {
                if (!uniqueSelectedMembersMap.has(m.natureName)) {
                    uniqueSelectedMembersMap.set(m.natureName, m);
                }
            });
            const selectedMembers = Array.from(uniqueSelectedMembersMap.values());
            
            let totalFee = 0;
            const formattedData = [];

            selectedMembers.forEach(member => {
                let memberFee = 0;
                const nName = member.natureName;
                if (feeRoles.includes(member.role)) {
                    totalFee += 35;
                    memberFee = 35;
                }

                // -------------------------------------------------------------
                // 填入有限資訊，無法推論的個資與保額欄位均填入空字串
                // -------------------------------------------------------------
                formattedData.push({
                    '自然名': nName,
                    '保險費用': memberFee,
                    '身份證號': '',
                    '姓名': '',
                    '出生日期(民國年)': '',
                    '國籍': '',
                    '性別': '',
                    '(1) 計畫別': '',
                    '(2) AT1保額': '',
                    '(3) MR保額': '',
                    '(4) MRC保額': '',
                    '(5) OH1保額': '',
                    '(6) OAA附約': '',
                    '家長姓名': '',
                    '與被保人關係': '',
                    '家長國籍': '',
                    '家長身分證號': '',
                    '家長出生日期': '',
                    '是否受有監護宣告': ''
                });
            });

            console.log("=== ready to push data ===");
            console.table(formattedData);

            // -------------------------------------------------------------
            // Google Apps Script 部署網址
            // -------------------------------------------------------------
            const gasUrl = 'https://script.google.com/macros/s/AKfycbxhgH9HlMfVXSN1iqYstuiYaEbjcD5vcSdtzSniPTCjQbPjKCTUAf2CQXIzj7YGM0mUug/exec';
            
            const submitBtn = document.querySelector('.btn-submit');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = '資料送出中...';
            submitBtn.disabled = true;

            fetch(gasUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                redirect: 'follow',
                body: JSON.stringify(formattedData)
            })
            .then(response => {
                if(!response.ok) throw new Error("Network response was not ok");
                return response.text();
            })
            .then(result => {
                console.log("伺服器回傳結果:", result);
                if (result.includes("Success")) {
                    const selectedNames = selectedMembers.map(m => m.natureName).join('、');
                    document.getElementById('selectedNamesDisplay').innerText = selectedNames;
                    document.getElementById('totalFeeDisplay').innerText = `$${totalFee}`;
                    document.getElementById('successModal').classList.add('active');
                } else {
                    alert("⚠️ 寫入失敗，請檢查網路並重新填寫表單");
                    console.error("後端錯誤內容:", result);
                }
            })
            .catch(error => {
                console.error('送出失敗:', error);
                alert('資料送出失敗，請檢查網路連線或稍後再試。');
            })
            .finally(() => {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            });
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
        }
    </script>
