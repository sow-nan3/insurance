<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荒野南三戶外探勘保險登記系統</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #50E3C2;
            --bg-grad: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-grad);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px 40px;
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 700;
            position: relative;
        }
        h2::after {
            content: '';
            width: 60px;
            height: 4px;
            background: var(--primary);
            display: block;
            margin: 10px auto 0;
            border-radius: 2px;
        }
        .step-group {
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s forwards;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        label {
            display: block;
            margin-bottom: 12px;
            color: #444;
            font-weight: 700;
            font-size: 16px;
        }
        
        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .chip {
            padding: 12px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 30px;
            background: white;
            color: #555;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            outline: none;
            flex-grow: 1;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        @media (min-width: 400px) {
            .chip { flex-grow: 0; }
        }
        .chip:hover {
            border-color: #a4c8e1;
            background: rgba(74, 144, 226, 0.05);
        }
        .chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
            transform: scale(1.02);
        }

        .member-list {
            display: grid;
            gap: 15px;
            margin-top: 15px;
        }
        .member-card {
            background: #fff;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .member-card:hover {
            border-color: #a4c8e1;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.08);
        }
        .member-card.selected {
            border-color: var(--primary);
            background: rgba(74, 144, 226, 0.05);
        }
        .member-card input {
            display: none;
        }
        .custom-checkbox {
            width: 26px;
            height: 26px;
            border: 2px solid #ccc;
            border-radius: 6px;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            flex-shrink: 0;
            background: white;
        }
        .member-card.selected .custom-checkbox {
            background: var(--primary);
            border-color: var(--primary);
        }
        .member-card.selected .custom-checkbox::after {
            content: '✓';
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        .member-info {
            flex-grow: 1;
        }
        .member-name {
            font-size: 17px;
            font-weight: bold;
            color: #333;
        }
        .member-tags {
            margin-top: 8px;
            font-size: 13px;
            color: #777;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            background: #eee;
            font-size: 13px;
            font-weight: 500;
        }
        .tag.fee { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), #357abd);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 25px;
            letter-spacing: 1px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4);
        }
        .btn-submit:active {
            transform: translateY(0);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: scale(0.8) translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        .modal-icon {
            font-size: 70px;
            margin-bottom: 15px;
            animation: bounceIn 1s;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .modal-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .modal-text {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 15px;
        }
        .modal-amount {
            font-size: 38px;
            color: #e74c3c;
            font-weight: 900;
            margin: 15px 0;
        }
        .btn-close {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
        }
        .btn-close:hover {
            background: #357abd;
            transform: scale(1.05);
        }
        
        @media (max-width: 480px) {
            .container { padding: 25px 20px; }
            .chip { font-size: 15px; padding: 10px 16px; }
        }
    </style>
</head>

        const feeRoles = ['小小蟻', '大蟻', '大蜂', '大鹿', '大鷹'];
        const currentROCYear = 115; 
        
        let selectedSquadValue = '';
        let selectedFamilyIdValue = '';
        let selectedAdultIdCard = ''; // 記錄點選的是哪一位大人

        function isAdult(birthStr) {
            if (!birthStr) return false;
            const yearStr = String(birthStr).split('.')[0];
            const year = parseInt(yearStr);
            if(isNaN(year)) return false;
            return (currentROCYear - year) >= 20;
        }

        function formatBirthTo7Digits(birthStr) {
            if (!birthStr) return '';
            const parts = String(birthStr).split('.');
            if(parts.length < 1) return '';
            const y = parts[0].padStart(3, '0');
            const m = (parts[1] || '1').padStart(2, '0');
            const d = (parts[2] || '1').padStart(2, '0');
            return `${y}${m}${d}`;
        }

        window.onload = () => {
            const squads = [...new Set(rawData.map(item => item.squad).filter(s => s !== '' && s !== 'nan'))];
            const squadList = document.getElementById('squadList');
            
            squads.forEach(squad => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.textContent = squad + '小隊';
				btn.textContent = squad ;
                btn.onclick = () => {
                    document.querySelectorAll('#squadList .chip').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    
                    selectedSquadValue = squad;
                    selectedFamilyIdValue = '';
                    selectedAdultIdCard = '';
                    updateNatureNames();
                };
                squadList.appendChild(btn);
            });
        };

        function updateNatureNames() {
            const natureNameGroup = document.getElementById('natureNameGroup');
            const natureNameList = document.getElementById('natureNameList');
            const familyGroup = document.getElementById('familyGroup');
            
            natureNameList.innerHTML = '';
            familyGroup.style.display = 'none';

            if (!selectedSquadValue) {
                natureNameGroup.style.display = 'none';
                return;
            }

            const adults = rawData.filter(m => m.squad === selectedSquadValue && isAdult(m.birth));
            
            // 使用 idCard 過濾確保每位大人都有自己的按鈕
            const seen = new Set();
            adults.forEach(adult => {
                if (!seen.has(adult.idCard)) {
                    seen.add(adult.idCard);
                    const btn = document.createElement('button');
                    btn.className = 'chip';
                    const nName = adult.natureName && adult.natureName !== 'nan' ? adult.natureName : '無自然名';
                    btn.textContent = `${nName} (${adult.name})`;
                    
                    btn.onclick = () => {
                        document.querySelectorAll('#natureNameList .chip').forEach(c => c.classList.remove('active'));
                        btn.classList.add('active');
                        
                        selectedFamilyIdValue = adult.id;
                        selectedAdultIdCard = adult.idCard; // 記錄選中的大人
                        updateFamilyMembers();
                    };
                    natureNameList.appendChild(btn);
                }
            });
            
            natureNameGroup.style.display = 'block';
            natureNameGroup.classList.remove('animate__fadeInUp');
            void natureNameGroup.offsetWidth;
            natureNameGroup.classList.add('animate__animated', 'animate__fadeInUp');
        }

        function updateFamilyMembers() {
            const familyGroup = document.getElementById('familyGroup');
            const membersContainer = document.getElementById('familyMembers');
            
            membersContainer.innerHTML = '';
            
            if (selectedFamilyIdValue === '') {
                familyGroup.style.display = 'none';
                return;
            }

            const allFamilyMembers = rawData.filter(m => String(m.id) === String(selectedFamilyIdValue));
            
            // 過濾重複的家庭成員 (以身分證字號為準)
            const uniqueMembersMap = new Map();
            allFamilyMembers.forEach(m => {
                if (!uniqueMembersMap.has(m.idCard)) {
                    uniqueMembersMap.set(m.idCard, m);
                }
            });
            const familyMembers = Array.from(uniqueMembersMap.values());
            
            familyMembers.forEach((member, index) => {
                const requiresFee = feeRoles.includes(member.role);
                const feeTag = requiresFee ? '<span class="tag fee">需保費 $35</span>' : '';
                const roleTag = (member.role && member.role !== 'nan') ? `<span class="tag">${member.role}</span>` : '';
                const nName = (member.natureName && member.natureName !== 'nan') ? `(${member.natureName})` : '';

                // 判斷是否為剛才選擇的那位大人，若是則預設選中
                const isSelected = (member.idCard === selectedAdultIdCard);
                const cardClass = isSelected ? 'member-card selected animate__animated animate__fadeInUp' : 'member-card animate__animated animate__fadeInUp';
                const checkedAttr = isSelected ? 'checked' : '';

                const card = document.createElement('label');
                card.className = cardClass;
                card.style.animationDelay = `${index * 0.05}s`;
                card.innerHTML = `
                    <div class="custom-checkbox"></div>
                    <input type="checkbox" value="${member.idCard}" ${checkedAttr} onchange="toggleCard(this)">
                    <div class="member-info">
                        <div class="member-name">${member.name} ${nName}</div>
                        <div class="member-tags">
                            ${roleTag}
                            ${feeTag}
                        </div>
                    </div>
                `;
                membersContainer.appendChild(card);
            });
            
            familyGroup.style.display = 'block';
        }

        function toggleCard(checkbox) {
            const card = checkbox.closest('.member-card');
            if (checkbox.checked) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        }

       function submitForm() {
            const checkboxes = document.querySelectorAll('#familyMembers input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                alert('請至少選擇一位參與保險的家庭成員！');
                return;
            }

            const selectedIdCards = Array.from(checkboxes).map(cb => cb.value);
            // 過濾 rawData，並確保選取的成員不會因為一人多職而重複
            const rawSelectedMembers = rawData.filter(m => selectedIdCards.includes(m.idCard));
            const uniqueSelectedMembersMap = new Map();
            rawSelectedMembers.forEach(m => {
                if (!uniqueSelectedMembersMap.has(m.idCard)) {
                    uniqueSelectedMembersMap.set(m.idCard, m);
                }
            });
            const selectedMembers = Array.from(uniqueSelectedMembersMap.values());
            
            const familyId = selectedMembers[0].id;
            const allFamilyMembers = rawData.filter(m => String(m.id) === String(familyId));
            
            const adultMales = allFamilyMembers.filter(m => isAdult(m.birth) && m.gender === '男');
            const adultFemales = allFamilyMembers.filter(m => isAdult(m.birth) && m.gender === '女');
            const parent = adultMales.length > 0 ? adultMales[0] : (adultFemales.length > 0 ? adultFemales[0] : null);

            let totalFee = 0;
            const formattedData = [];

            selectedMembers.forEach(member => {
                if (feeRoles.includes(member.role)) {
                    totalFee += 35;
                }

                const isAd = isAdult(member.birth);
                let relation = '';
                
                if (!isAd && parent) {
                    if (parent.gender === '男') {
                        relation = member.gender === '男' ? '父子' : '父女';
                    } else {
                        relation = member.gender === '男' ? '母子' : '母女';
                    }
                }

                // 這裡欄位名稱必須與您的 Google Apps Script 後端接收的欄位一致
                formattedData.push({
                    '身份證號': member.idCard,
                    '姓名': member.name,
                    '出生日期(民國年)': formatBirthTo7Digits(member.birth),
                    '國籍': '中華民國',
                    '性別': member.gender,
                    '(1) 計畫別': isAd ? 'TA' : 'CTA',
                    '(2) AT1保額': isAd ? 100 : '',
                    '(3) MR保額': isAd ? 10 : '',
                    '(4) MRC保額': isAd ? 0 : 10,
                    '(5) OH1保額': '',
                    '(6) OAA附約': '',
                    '家長姓名': isAd ? '' : (parent ? parent.name : ''),
                    '與被保人關係': isAd ? '' : relation,
                    '家長國籍': '中華民國',
                    '家長身分證號': isAd ? '' : (parent ? parent.idCard : ''),
                    '家長出生日期': isAd ? '' : (parent ? formatBirthTo7Digits(parent.birth) : ''),
                    '是否受有監護宣告': '否'
                });
            });

            console.log("=== 準備寫入後端 Google Sheet 的資料 ===");
            console.table(formattedData);

            // -------------------------------------------------------------
            // ⭐ 請將您的 Google Apps Script 部署網址貼在下方的單引號裡面 ⭐
            // -------------------------------------------------------------
            const gasUrl = 'https://script.google.com/macros/s/AKfycbxhgH9HlMfVXSN1iqYstuiYaEbjcD5vcSdtzSniPTCjQbPjKCTUAf2CQXIzj7YGM0mUug/exec';
            
            // 更改按鈕文字提示正在處理中
            const submitBtn = document.querySelector('.btn-submit');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = '資料送出中...';
            submitBtn.disabled = true;

            // 發送資料到 Google Apps Script
            fetch(gasUrl, {
                method: 'POST',
                // 如果遇到 CORS 跨域問題，通常在 GAS 中使用 'text/plain' 可以避開 preflight 檢查
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(formattedData)
            })
            .then(response => response.text()) // 假設您的 GAS 回傳純文字，例如 "Success"
            .then(result => {
                console.log("伺服器回傳結果:", result);
                
                // 成功送出後顯示彈窗與總金額
                document.getElementById('totalFeeDisplay').innerText = `$${totalFee}`;
                document.getElementById('successModal').classList.add('active');
            })
            .catch(error => {
                console.error('送出失敗:', error);
                alert('資料送出失敗，請檢查網路連線或稍後再試。');
            })
            .finally(() => {
                // 恢復按鈕狀態
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            });
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
        }
    </script>
</body>
</html>
